name: Screen scan Windows build

on:
  push:
    branches:
      - feature/independent-screen-scan-frames
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        self_contained: [true, false]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish WindowTranslator
        shell: pwsh
        run: |
          dotnet publish WindowTranslator -c Release -o publish --sc ${{ matrix.self_contained }} `
            -p:Version=0.0.0-screen-scan `
            -p:AssemblyVersion=0.0.0.0 `
            -p:FileVersion=0.0.0.0 `
            -p:InformationalVersion=0.0.0-screen-scan

      - name: Upload portable build
        uses: actions/upload-artifact@v7
        with:
          name: WindowTranslator-screen-scan-${{ matrix.self_contained && 'self-contained' || 'framework-dependent' }}
          path: publish/
          if-no-files-found: error
          compression-level: 6
