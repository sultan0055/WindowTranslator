name: Screen scan Windows build

on:
  push:
    branches:
      - feature/independent-screen-scan-frames
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screen-scan-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained Windows build
        shell: pwsh
        run: |
          dotnet publish WindowTranslator -c Release -o publish --sc true `
            -p:Version=0.0.0-screen-scan `
            -p:AssemblyVersion=0.0.0.0 `
            -p:FileVersion=0.0.0.0 `
            -p:InformationalVersion=0.0.0-screen-scan

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: WindowTranslator-screen-scan
          path: publish/
          if-no-files-found: error
          compression-level: 6
